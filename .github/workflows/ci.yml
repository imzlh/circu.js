name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Deploy API Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install
      - name: Build TypeDoc
        run: pnpm run api-docs
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './api'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        
  build-linux-x86_64:
    name: Test Build - Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build \
            libcurl4-openssl-dev libltdl-dev libffi-dev \
            libsqlite3-dev libssl-dev zlib1g-dev libexpat1-dev
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-x86_64-test
          path: build/cjs

  build-macos-arm64:
    name: Test Build - macOS x86_64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install cmake ninja libffi sqlite3 openssl@3 zlib expat curl
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-arm64-test
          path: build/cjs

  build-windows-x86_64:
    name: Test Build - Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0b88aacde46a853151730fbe7d0b7ee45f4b6864'
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install sqlite3:x64-windows openssl:x64-windows zlib:x64-windows expat:x64-windows curl:x64-windows libffi:x64-windows libiconv:x64-windows
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_WITH_CURL=ON
          cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-windows-x86_64-test
          path: build/cjs.exe
