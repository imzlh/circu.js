name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      all-release-targets:
        description: Also compile all Linux release architectures
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/build-native.yml

  i386:
    name: Linux i386
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: '386'
      - name: Build and smoke test
        run: |
          docker run --rm --platform linux/386 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            debian:bookworm-slim sh scripts/ci/build-linux.sh glibc i386
      - uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-i386-test
          path: artifacts/cjs-linux-i386.tar.gz
          if-no-files-found: error

  linux:
    if: inputs.all-release-targets == true
    uses: ./.github/workflows/build-linux.yml

  cross:
    if: inputs.all-release-targets == true
    uses: ./.github/workflows/build-cross-linux.yml
