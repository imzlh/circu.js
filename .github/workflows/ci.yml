name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Test Build - 三个平台 x86_64
  build-linux-x86_64:
    name: Test Build - Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build libcurl4-openssl-dev libltdl-dev libffi-dev
      - name: Build
        run: cmake -B build -G Ninja && cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-x86_64-test
          path: build/cjs

  build-macos-x86_64:
    name: Test Build - macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: brew install cmake ninja libffi
      - name: Build
        run: cmake -B build -G Ninja && cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-x86_64-test
          path: build/cjs

  build-windows-x86_64:
    name: Test Build - Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-windows-x86_64-test
          path: build/cjs.exe
