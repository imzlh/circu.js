name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # 代码检查和文档生成测试
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: |
          npm install
          sudo apt update
          sudo apt install -y clang-format
      - name: Run the linter
        run: npm run lint
      - name: Run the formatter
        run: clang-format -i src/*.{c,h}
      - name: Check if the tree is dirty
        run: $(exit $(git status --porcelain --untracked-files=no | head -255 | wc -l)) || (echo "Dirty git tree"; git diff; exit 1)

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: |
          npm install
          sudo apt update
          sudo apt install -y libcurl4-openssl-dev
      - name: Build JS
        run: make js
      - name: Check if the git repository is clean
        run: $(exit $(git status --porcelain --untracked-files=no | head -255 | wc -l)) || (echo "Dirty git tree"; git diff; exit 1)

  docs:
    name: TypeDoc Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeDoc
        run: npm run api-docs

  # Test Build - 三个平台 x86_64
  build-linux-x86_64:
    name: Test Build - Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build libcurl4-openssl-dev libltdl-dev libffi-dev
      - name: Build
        run: cmake -B build -G Ninja && cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-x86_64-test
          path: build/cjs

  build-macos-x86_64:
    name: Test Build - macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: brew install cmake ninja libffi
      - name: Build
        run: cmake -B build -G Ninja && cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-x86_64-test
          path: build/cjs

  build-windows-x86_64:
    name: Test Build - Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-windows-x86_64-test
          path: build/cjs.exe
