name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build \
            libcurl4-openssl-dev libltdl-dev libffi-dev \
            libsqlite3-dev libssl-dev zlib1g-dev libexpat1-dev
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Package
        run: |
          mkdir -p dist/cjs-linux-x86_64
          cp build/cjs dist/cjs-linux-x86_64/
          strip dist/cjs-linux-x86_64/cjs
          cd dist && tar czf cjs-linux-x86_64.tar.gz cjs-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-x86_64
          path: dist/cjs-linux-x86_64.tar.gz

  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross compile toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt update || true
          sudo apt install -y libsqlite3-dev:arm64 libssl-dev:arm64 zlib1g-dev:arm64 libexpat1-dev:arm64 libcurl4-openssl-dev:arm64 libffi-dev:arm64 || true
      - name: Build with cross toolchain
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DBUILD_WITH_CURL=OFF
          cmake --build build || echo "Cross compile may fail due to missing libs"
      - name: Package
        if: success()
        run: |
          mkdir -p dist/cjs-linux-arm64
          cp build/cjs dist/cjs-linux-arm64/
          aarch64-linux-gnu-strip dist/cjs-linux-arm64/cjs || true
          cd dist && tar czf cjs-linux-arm64.tar.gz cjs-linux-arm64
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-arm64
          path: dist/cjs-linux-arm64.tar.gz
          if-no-files-found: ignore

  build-linux-armv7:
    name: Linux ARMv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross compile toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf cmake ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DBUILD_WITH_CURL=OFF
          cmake --build build || echo "Cross compile may fail due to missing libs"
      - name: Package
        if: success()
        run: |
          mkdir -p dist/cjs-linux-armv7
          cp build/cjs dist/cjs-linux-armv7/
          arm-linux-gnueabihf-strip dist/cjs-linux-armv7/cjs || true
          cd dist && tar czf cjs-linux-armv7.tar.gz cjs-linux-armv7
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-armv7
          path: dist/cjs-linux-armv7.tar.gz
          if-no-files-found: ignore

  build-linux-musl:
    name: Linux Musl ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            toolchain: x86_64-linux-musl
            cc: x86_64-linux-musl-gcc
          - target: aarch64
            toolchain: aarch64-linux-musl
            cc: aarch64-linux-musl-gcc
          - target: armv7l
            toolchain: armv7l-linux-musleabihf
            cc: armv7l-linux-musleabihf-gcc
          - target: armv6
            toolchain: arm-linux-musleabihf
            cc: arm-linux-musleabihf-gcc
          - target: armv5
            toolchain: armv5te-linux-musleabi
            cc: armv5te-linux-musleabi-gcc
          - target: mips
            toolchain: mips-linux-musl
            cc: mips-linux-musl-gcc
          - target: mipsel
            toolchain: mipsel-linux-musl
            cc: mipsel-linux-musl-gcc
          - target: mips64
            toolchain: mips64-linux-musl
            cc: mips64-linux-musl-gcc
          - target: riscv64
            toolchain: riscv64-linux-musl
            cc: riscv64-linux-musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download musl.cc toolchain
        run: |
          cd /tmp
          wget -q "https://musl.cc/${{ matrix.toolchain }}-cross.tgz"
          tar xzf "${{ matrix.toolchain }}-cross.tgz"
          sudo mv "${{ matrix.toolchain }}-cross" /opt/
          echo "/opt/${{ matrix.toolchain }}-cross/bin" >> $GITHUB_PATH
      - name: Build with musl
        run: |
          export CC=/opt/${{ matrix.toolchain }}-cross/bin/${{ matrix.cc }}
          export CXX=/opt/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-g++
          export AR=/opt/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-ar
          export STRIP=/opt/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-strip
          
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_AR=$AR \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DBUILD_WITH_CURL=OFF
          cmake --build build 2>&1 || echo "Build may fail for some archs, continuing..."
      - name: Package
        if: success()
        run: |
          mkdir -p dist/cjs-linux-musl-${{ matrix.target }}
          cp build/cjs dist/cjs-linux-musl-${{ matrix.target }}/ 2>/dev/null || true
          /opt/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-strip dist/cjs-linux-musl-${{ matrix.target }}/cjs 2>/dev/null || true
          cd dist && tar czf cjs-linux-musl-${{ matrix.target }}.tar.gz cjs-linux-musl-${{ matrix.target }} || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cjs-linux-musl-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

  build-macos-x86_64:
    name: macOS x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install cmake ninja libffi sqlite3 openssl zlib expat curl
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build
      - name: Package
        run: |
          mkdir -p dist/cjs-macos-x86_64
          cp build/cjs dist/cjs-macos-x86_64/
          strip dist/cjs-macos-x86_64/cjs
          cd dist && tar czf cjs-macos-x86_64.tar.gz cjs-macos-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-x86_64
          path: dist/cjs-macos-x86_64.tar.gz

  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install cmake ninja libffi sqlite3 openssl zlib expat curl
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build
      - name: Package
        run: |
          mkdir -p dist/cjs-macos-arm64
          cp build/cjs dist/cjs-macos-arm64/
          strip dist/cjs-macos-arm64/cjs
          cd dist && tar czf cjs-macos-arm64.tar.gz cjs-macos-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-arm64
          path: dist/cjs-macos-arm64.tar.gz

  build-macos-universal:
    name: macOS Universal (x86_64 + ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install cmake ninja libffi sqlite3 openssl zlib expat curl
      - name: Build Universal Binary
        run: |
          # Build for ARM64
          cmake -B build-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-arm64

          # Build for x86_64
          cmake -B build-x86_64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-x86_64

          # Create universal binary
          mkdir -p dist/cjs-macos-universal
          lipo -create build-arm64/cjs build-x86_64/cjs -output dist/cjs-macos-universal/cjs
          strip dist/cjs-macos-universal/cjs
          cd dist && tar czf cjs-macos-universal.tar.gz cjs-macos-universal
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-universal
          path: dist/cjs-macos-universal.tar.gz

  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0b88aacde46a853151730fbe7d0b7ee45f4b6864'
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install sqlite3:x64-windows openssl:x64-windows zlib:x64-windows expat:x64-windows curl:x64-windows libffi:x64-windows
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_WITH_CURL=ON
          cmake --build build
      - name: Package
        shell: cmd
        run: |
          mkdir dist\cjs-windows-x86_64
          copy build\cjs.exe dist\cjs-windows-x86_64\
          cd dist && powershell -Command "Compress-Archive -Path cjs-windows-x86_64 -DestinationPath cjs-windows-x86_64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-windows-x86_64
          path: dist/cjs-windows-x86_64.zip

  build-windows-x86:
    name: Windows x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0b88aacde46a853151730fbe7d0b7ee45f4b6864'
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install sqlite3:x86-windows openssl:x86-windows zlib:x86-windows expat:x86-windows curl:x86-windows libffi:x86-windows
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_WITH_CURL=ON
          cmake --build build
      - name: Package
        shell: cmd
        run: |
          mkdir dist\cjs-windows-x86
          copy build\cjs.exe dist\cjs-windows-x86\
          cd dist && powershell -Command "Compress-Archive -Path cjs-windows-x86 -DestinationPath cjs-windows-x86.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-windows-x86
          path: dist/cjs-windows-x86.zip

  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '0b88aacde46a853151730fbe7d0b7ee45f4b6864'
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install sqlite3:arm64-windows openssl:arm64-windows zlib:arm64-windows expat:arm64-windows curl:arm64-windows libffi:arm64-windows || true
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DBUILD_WITH_CURL=ON || echo "ARM64 may have missing packages"
          cmake --build build
      - name: Package
        shell: cmd
        run: |
          mkdir dist\cjs-windows-arm64
          copy build\cjs.exe dist\cjs-windows-arm64\
          cd dist && powershell -Command "Compress-Archive -Path cjs-windows-arm64 -DestinationPath cjs-windows-arm64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cjs-windows-arm64
          path: dist/cjs-windows-arm64.zip

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-linux-armv7
      - build-linux-musl
      - build-macos-x86_64
      - build-macos-arm64
      - build-macos-universal
      - build-windows-x86_64
      - build-windows-x86
      - build-windows-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cjs-*

      - name: Organize artifacts
        run: |
          cd dist
          find . -name "*.tar.gz" -exec mv {} . \;
          find . -name "*.zip" -exec mv {} . \;
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
