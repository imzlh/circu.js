name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/build-linux.yml
  cross:
    uses: ./.github/workflows/build-cross-linux.yml
  native:
    uses: ./.github/workflows/build-native.yml
    with:
      include-asan: false
      native-matrix: >-
        [{"platform":"macos","arch":"x86_64","runner":"macos-15-intel"},
         {"platform":"macos","arch":"arm64","runner":"macos-15"},
         {"platform":"windows","arch":"x86_64","runner":"windows-2022"},
         {"platform":"windows","arch":"x86","runner":"windows-2022"},
         {"platform":"windows","arch":"arm64","runner":"windows-11-arm"}]

  types:
    name: Type declarations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package standalone declarations
        run: tar -czf cjs-types.tar.gz types
      - uses: actions/upload-artifact@v4
        with:
          name: cjs-types
          path: cjs-types.tar.gz
          if-no-files-found: error

  universal:
    name: macOS universal
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cjs-macos-*
          merge-multiple: true
      - name: Combine both runtime and bytecode compiler
        run: |
          mkdir x86 arm universal
          tar -xzf cjs-macos-x86_64.tar.gz -C x86
          tar -xzf cjs-macos-arm64.tar.gz -C arm
          mkdir universal/lib
          for library in arm/lib/*.dylib; do
            name="$(basename "$library")"
            test -f "x86/lib/$name"
            lipo -create "x86/lib/$name" "$library" -output "universal/lib/$name"
            codesign --force --sign - "universal/lib/$name"
            lipo -verify_arch x86_64 arm64 "universal/lib/$name"
          done
          for library in x86/lib/*.dylib; do
            test -f "universal/lib/$(basename "$library")"
          done
          for binary in cjs cjsc; do
            lipo -create "x86/$binary" "arm/$binary" -output "universal/$binary"
            codesign --force --sign - "universal/$binary"
            lipo -verify_arch x86_64 arm64 "universal/$binary"
          done
          cp -R arm/types universal/types
          cp arm/LICENSE arm/RUNTIME.txt universal/
          tar -czf cjs-macos-universal.tar.gz -C universal cjs cjsc types lib LICENSE RUNTIME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cjs-macos-universal
          path: cjs-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, cross, native, types, universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cjs-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
